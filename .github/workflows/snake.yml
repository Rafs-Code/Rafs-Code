name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # jalan tiap hari jam 00:00 UTC
  workflow_dispatch:  # bisa di-trigger manual juga

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Rafs-Code
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7c3aed&color_dots=#1a0533,#2e1065,#5b21b6,#7c3aed,#a855f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
