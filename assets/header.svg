<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color"
          values="#ff0000;#ff8800;#ffff00;#00ff00;#0088ff;#8800ff;#ff0000"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="16%" stop-color="#ff8800">
        <animate attributeName="stop-color"
          values="#ff8800;#ffff00;#00ff00;#0088ff;#8800ff;#ff0000;#ff8800"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#ffff00">
        <animate attributeName="stop-color"
          values="#ffff00;#00ff00;#0088ff;#8800ff;#ff0000;#ff8800;#ffff00"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00ff00">
        <animate attributeName="stop-color"
          values="#00ff00;#0088ff;#8800ff;#ff0000;#ff8800;#ffff00;#00ff00"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#0088ff">
        <animate attributeName="stop-color"
          values="#0088ff;#8800ff;#ff0000;#ff8800;#ffff00;#00ff00;#0088ff"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="83%" stop-color="#8800ff">
        <animate attributeName="stop-color"
          values="#8800ff;#ff0000;#ff8800;#ffff00;#00ff00;#0088ff;#8800ff"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff0000">
        <animate attributeName="stop-color"
          values="#ff0000;#ff8800;#ffff00;#00ff00;#0088ff;#8800ff;#ff0000"
          dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="20" fill="#0a0a0a"/>

  <!-- Border rainbow FULL -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="url(#rainbow)" stroke-width="3"
    filter="url(#glow)"/>

  <!-- Nama -->
  <text x="400" y="95" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold"
    fill="#ffffff" filter="url(#textGlow)">
    Raffa
  </text>

  <!-- Role -->
  <text x="400" y="135" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="16"
    fill="#cccccc" opacity="0.9">
    Data Scientist · Web Enthusiast · Video Editor · Photographer
  </text>

  <!-- Garis dekoratif rainbow -->
  <line x1="250" y1="160" x2="550" y2="160"
    stroke="url(#rainbow)" stroke-width="1.5" opacity="0.5"
    filter="url(#glow)"/>
</svg>
