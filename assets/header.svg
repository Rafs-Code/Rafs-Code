<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed">
        <animate attributeName="stop-color"
          values="#7c3aed;#e879f9;#a855f7;#7c3aed"
          dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#e879f9">
        <animate attributeName="stop-color"
          values="#e879f9;#7c3aed;#c084fc;#e879f9"
          dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="220" rx="20" fill="#0d0117"/>

  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="url(#neonBorder)" stroke-width="3"
    filter="url(#glow)"/>

  <text x="400" y="95" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold"
    fill="#e2d9f3" filter="url(#textGlow)">
    Raffa
  </text>

  <text x="400" y="135" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="16"
    fill="#a78bfa" opacity="0.9">
    Data Scientist · Web Enthusiast · Video Editor · Photographer
  </text>

  <line x1="250" y1="160" x2="550" y2="160"
    stroke="url(#neonBorder)" stroke-width="1.5" opacity="0.5"
    filter="url(#glow)"/>
</svg>
