<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <!-- Trail gradient: warna solid di depan, fade ke transparan di belakang -->
    <linearGradient id="trail1" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="200" y2="3">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff0000" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ff0000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="20" fill="#0a0a0a"/>

  <!-- Border statis tipis (base track) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- GARIS 1: posisi awal 0 -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="200 1816"
    stroke-linecap="round"
    filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
      values="0;-2016" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Trail garis 1 -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="400 1616"
    stroke-linecap="round"
    opacity="0.15">
    <animate attributeName="stroke-dashoffset"
      values="200;-1816" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- GARIS 2: posisi awal 1/3 keliling (672px) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="200 1816"
    stroke-linecap="round"
    filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
      values="-672;-2688" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Trail garis 2 -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="400 1616"
    stroke-linecap="round"
    opacity="0.15">
    <animate attributeName="stroke-dashoffset"
      values="-472;-2488" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- GARIS 3: posisi awal 2/3 keliling (1344px) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="200 1816"
    stroke-linecap="round"
    filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
      values="-1344;-3360" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Trail garis 3 -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="400 1616"
    stroke-linecap="round"
    opacity="0.15">
    <animate attributeName="stroke-dashoffset"
      values="-1144;-3160" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Nama -->
  <text x="400" y="95" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold"
    fill="#ffffff" filter="url(#softShadow)">
    Raffa
  </text>

  <!-- Tagline -->
  <text x="400" y="135" text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace" font-size="14"
    fill="#888888" font-style="italic">
    Currently building things that matter.
  </text>

  <!-- Garis dekoratif -->
  <line x1="280" y1="160" x2="520" y2="160"
    stroke="#222222" stroke-width="1" opacity="0.5"/>
</svg>
