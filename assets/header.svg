<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="20" fill="#0d0117"/>

  <!-- Border statis (tipis, base) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#2e1065" stroke-width="1.5"/>

  <!-- Border animated: garis cahaya yang JALAN -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#a855f7" stroke-width="3"
    stroke-dasharray="120 1896"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      values="0;-2016"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Layer kedua: warna beda, arah beda -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#e879f9" stroke-width="2"
    stroke-dasharray="80 1936"
    opacity="0.6"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      values="-2016;0"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Nama -->
  <text x="400" y="95" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold"
    fill="#e2d9f3" filter="url(#textGlow)">
    Raffa
  </text>

  <!-- Role -->
  <text x="400" y="135" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="16"
    fill="#a78bfa" opacity="0.9">
    Data Scientist · Web Enthusiast · Video Editor · Photographer
  </text>

  <!-- Garis dekoratif -->
  <line x1="250" y1="160" x2="550" y2="160"
    stroke="#7c3aed" stroke-width="1" opacity="0.4"
    filter="url(#glow)"/>
</svg>
