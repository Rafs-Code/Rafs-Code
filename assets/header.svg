<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="20" fill="#0d0117"/>

  <!-- Border statis tipis -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#333333" stroke-width="1"/>

  <!-- Cahaya MERAH jalan -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#ff0000" stroke-width="3"
    stroke-dasharray="120 1896"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      values="0;-2016"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Cahaya HIJAU jalan (delay sepertiga) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#00ff00" stroke-width="3"
    stroke-dasharray="120 1896"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      values="-672;-2688"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Cahaya BIRU jalan (delay duapertiga) -->
  <rect x="3" y="3" width="794" height="214" rx="18"
    fill="none" stroke="#0088ff" stroke-width="3"
    stroke-dasharray="120 1896"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      values="-1344;-3360"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Nama -->
  <text x="400" y="95" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold"
    fill="#ffffff" filter="url(#textGlow)">
    Raffa
  </text>

  <!-- Role -->
  <text x="400" y="135" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-size="16"
    fill="#cccccc" opacity="0.9">
    Data Scientist · Web Enthusiast · Video Editor · Photographer
  </text>

  <!-- Garis dekoratif -->
  <line x1="250" y1="160" x2="550" y2="160"
    stroke="#555555" stroke-width="1" opacity="0.4"
    filter="url(#glow)"/>
</svg>
